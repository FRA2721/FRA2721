<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 16" width="300" height="16" fill="none" role="img" aria-label="Open to collaborations">
<style>
.t{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:2.8px;fill:#6E7681}
.c{fill:#3FB950}
.h{fill:#3FB950;opacity:0;transform-origin:4px 8px;animation:h 3s cubic-bezier(.4,0,.2,1) infinite}
@keyframes h{0%{transform:scale(1);opacity:.45}70%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}
</style>
<circle class="h" cx="4" cy="8" r="2.6"/><circle class="c" cx="4" cy="8" r="2.6"/>
<text class="t" x="16" y="12">OPEN TO COLLABORATIONS</text>
</svg>
