<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 18" width="320" height="18" fill="none" role="img" aria-label="Open to collaborations">
<style>
.t{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:12px;letter-spacing:3.4px;fill:#57606A}
.core{fill:#3FB950}
.halo{fill:#3FB950;opacity:0;transform-origin:5px 9px;animation:halo 3s cubic-bezier(.4,0,.2,1) infinite}
@keyframes halo{0%{transform:scale(1);opacity:.45}70%{transform:scale(3.4);opacity:0}100%{transform:scale(3.4);opacity:0}}
</style>
<circle class="halo" cx="5" cy="9" r="3"/>
<circle class="core" cx="5" cy="9" r="3"/>
<text class="t" x="20" y="14">OPEN TO COLLABORATIONS</text>
</svg>
