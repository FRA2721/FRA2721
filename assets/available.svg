<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 18" width="320" height="18" fill="none" role="img" aria-label="Open to collaborations">
  <style>
    .t { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; letter-spacing: 2.6px; fill: #8B949E; }
    .core { fill: #3FB950; }
    .halo { fill: #3FB950; transform-origin: 6px 9px; animation: halo 2.8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes halo {
      0%   { transform: scale(1);   opacity: .45; }
      70%  { transform: scale(3.4); opacity: 0; }
      100% { transform: scale(3.4); opacity: 0; }
    }
  </style>
  <circle class="halo" cx="6" cy="9" r="3"/>
  <circle class="core" cx="6" cy="9" r="3"/>
  <text class="t" x="20" y="13">OPEN TO COLLABORATIONS</text>
</svg>
