<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none" role="img" aria-label="Francesco Cimino — Full-Stack AI Web Developer, Startup Builder">
  <style>
    .name { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 200; font-size: 66px; letter-spacing: 14px; fill: #0D1117; }
    .sub  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; letter-spacing: 6.5px; fill: #57606A; }
    .meta { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 3.2px; fill: #8C959F; }
    .rule { stroke: #D0D7DE; stroke-width: 1; }
    .mark { stroke: #0D1117; stroke-width: 1.4; fill: none; stroke-linecap: round; }

    .up { opacity: 0; transform: translateY(16px); animation: up .95s cubic-bezier(.16,.84,.26,1) forwards; }
    @keyframes up { to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: .10s; } .d2 { animation-delay: .70s; } .d3 { animation-delay: .90s; }

    .draw { stroke-dasharray: 1040; stroke-dashoffset: 1040; animation: draw 1.8s cubic-bezier(.16,.84,.26,1) .25s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .trace { stroke-dasharray: 62 199; stroke-dashoffset: 62; opacity: 0; animation: fade .8s ease 1.1s forwards, trace 9s cubic-bezier(.45,0,.55,1) 1.1s infinite; }
    @keyframes trace { to { stroke-dashoffset: -199; } }
    @keyframes fade { to { opacity: .9; } }
  </style>

  <text class="name up d1" x="80" y="120">FRANCESCO CIMINO</text>

  <line class="rule draw" x1="80" y1="158" x2="1120" y2="158"/>

  <text class="sub up d2" x="82" y="196">FULL-STACK AI WEB DEVELOPER &#183; STARTUP BUILDER</text>
  <text class="meta up d3" x="1120" y="196" text-anchor="end">COSENZA &#183; IT</text>

  <g transform="translate(1024 96) scale(1.2)">
    <path class="mark trace" d="M0,0 C0,-21 31,-21 31,0 C31,21 62,21 62,0 C62,-21 31,-21 31,0 C31,21 0,21 0,0 Z"/>
  </g>
</svg>
