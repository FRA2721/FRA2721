<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" fill="none" role="img" aria-label="Francesco Cimino — Full-Stack AI Web Developer, Startup Builder">
<style>
@font-face{font-family:'JostL';font-style:normal;font-weight:200;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'JostR';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.name{font-family:'JostL','Jost','Futura','Century Gothic','Avenir Next',sans-serif;font-weight:200;font-size:68px;letter-spacing:13px;fill:#0D1117}
.sub{font-family:'JostR','Jost','Futura','Century Gothic','Avenir Next',sans-serif;font-weight:400;font-size:16px;letter-spacing:6.5px;fill:#57606A}
.meta{font-family:'JostR','Jost','Futura','Century Gothic','Avenir Next',sans-serif;font-weight:400;font-size:14px;letter-spacing:4px;fill:#8C959F}
.rule{stroke:#D0D7DE;stroke-width:1}
.mark{stroke:#0D1117;stroke-width:1.4;fill:none;stroke-linecap:round}
.up{animation:up .95s cubic-bezier(.16,.84,.26,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.10s}.d2{animation-delay:.70s}.d3{animation-delay:.90s}
.draw{animation:draw 1.8s cubic-bezier(.16,.84,.26,1) .25s}
@keyframes draw{from{stroke-dasharray:1200;stroke-dashoffset:1200}to{stroke-dasharray:1200;stroke-dashoffset:0}}
.mark{opacity:.9}
.trace{animation:trace 9s cubic-bezier(.45,0,.55,1) 1.1s infinite}
@keyframes trace{from{stroke-dasharray:62 199;stroke-dashoffset:62}to{stroke-dasharray:62 199;stroke-dashoffset:-199}}
</style>
<text class="name up d1" x="0" y="86">FRANCESCO CIMINO</text>
<line class="rule draw" x1="0" y1="124" x2="1200" y2="124"/>
<text class="sub up d2" x="2" y="162">FULL-STACK AI WEB DEVELOPER · STARTUP BUILDER</text>
<text class="meta up d3" x="1198" y="162" text-anchor="end">COSENZA · IT</text>
<g transform="translate(1104 62) scale(1.2)">
<path class="mark trace" d="M0,0 C0,-21 31,-21 31,0 C31,21 62,21 62,0 C62,-21 31,-21 31,0 C31,21 0,21 0,0 Z"/>
</g>
</svg>
