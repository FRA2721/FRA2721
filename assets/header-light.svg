<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" fill="none" role="img" aria-label="Francesco Cimino, full stack AI web developer">
<style>
.tiny{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:11px;letter-spacing:2.6px;fill:#9B9B9B}
.big{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:200;font-size:122px;letter-spacing:-3px;fill:#111111}
.sm{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:500;font-size:17px;letter-spacing:.2px;fill:#111111}
.mi{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.9px;fill:#9B9B9B}
.rt{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:13.5px;letter-spacing:.2px;fill:#6E6E6E}
.nv{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:19px;letter-spacing:.4px;fill:#111111}
.ar{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:15px;fill:#6E6E6E}
.r{stroke:#DADADA;stroke-width:1}
</style>
<text class="tiny" x="0" y="26">FRANCESCO/</text>
<text class="tiny" x="600" y="26" text-anchor="middle">AI &#183; WEB &#183; STARTUPS</text>
<text class="tiny" x="1200" y="26" text-anchor="end">COSENZA, IT</text>
<line class="r" x1="0" y1="44" x2="1200" y2="44"/>

<text class="big" x="0" y="250">francesco cimino</text>
<line class="r" x1="0" y1="276" x2="1200" y2="276"/>
<text class="sm" x="0" y="306">Full stack AI web developer.</text>
<g><text class="mi" x="0" y="336">Independent. I work with founders, authors and artists.</text><text class="mi" x="0" y="354">Strategy, design, code and delivery are one single job.</text></g>
<g><text class="rt" x="1200" y="404" text-anchor="end">I grew up in a small town in Calabria</text><text class="rt" x="1200" y="427" text-anchor="end">and I kept leaving it to learn where</text><text class="rt" x="1200" y="450" text-anchor="end">things actually happen. I build web</text><text class="rt" x="1200" y="473" text-anchor="end">products with artificial intelligence</text><text class="rt" x="1200" y="496" text-anchor="end">inside them, and I work best next to</text><text class="rt" x="1200" y="519" text-anchor="end">people who already know where they</text><text class="rt" x="1200" y="542" text-anchor="end">are going.</text></g>

<line class="r" x1="0" y1="546" x2="1200" y2="546"/>
<g><text class="ar" x="0" y="590">&#8600;</text><text class="nv" x="26" y="590">Work</text><text class="ar" x="300" y="590">&#8600;</text><text class="nv" x="326" y="590">Abroad</text><text class="ar" x="600" y="590">&#8600;</text><text class="nv" x="626" y="590">Contact</text></g>
</svg>
