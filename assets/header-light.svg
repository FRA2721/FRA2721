<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" fill="none" role="img" aria-label="Francesco Cimino, full stack AI web developer and startup builder">
<style>
.name{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:200;font-size:70px;letter-spacing:12px;fill:#0D1117}
.sub{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:15px;letter-spacing:6.5px;fill:#57606A}
.meta{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400;font-size:13px;letter-spacing:4px;fill:#8C959F}
.rule{stroke:#D0D7DE;stroke-width:1}
.mark{stroke:#0D1117;stroke-width:1.4;fill:none;stroke-linecap:round;opacity:.9}
.up{animation:up 1s cubic-bezier(.16,.84,.26,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.d2{animation-delay:.55s}.d3{animation-delay:.75s}
.draw{animation:draw 1.9s cubic-bezier(.16,.84,.26,1) .2s}
@keyframes draw{from{stroke-dasharray:1200;stroke-dashoffset:1200}to{stroke-dasharray:1200;stroke-dashoffset:0}}
.trace{animation:trace 10s cubic-bezier(.45,0,.55,1) 1s infinite}
@keyframes trace{from{stroke-dasharray:62 199;stroke-dashoffset:62}to{stroke-dasharray:62 199;stroke-dashoffset:-199}}
</style>
<text class="name up" x="0" y="88">FRANCESCO CIMINO</text>
<line class="rule draw" x1="0" y1="126" x2="1200" y2="126"/>
<text class="sub up d2" x="2" y="164">FULL STACK AI WEB DEVELOPER &#183; STARTUP BUILDER</text>
<text class="meta up d3" x="1198" y="164" text-anchor="end">COSENZA &#183; IT</text>
<g transform="translate(1108 64) scale(1.15)">
<path class="mark trace" d="M0,0 C0,-21 31,-21 31,0 C31,21 62,21 62,0 C62,-21 31,-21 31,0 C31,21 0,21 0,0 Z"/>
</g>
</svg>
